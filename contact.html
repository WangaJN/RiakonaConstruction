  <!-- CONTACT -->
  <div class="contact">
    <form action="https://api.web3forms.com/submit" method="POST" id="contactForm" name="contactForm">
      <h1>Get in touch</h1>
      <h6>Connect with us today</h6>


      <div class="form__group field">
        <input type="input" class="form__field" placeholder="Your Name*" name="name" id="name"
          style="color:white ;margin-top: 3%" required />
        <label for="name" class="form__label">Your Name*</label>
      </div>

      <div class="form__group field">
        <input type="input" class="form__field" placeholder="Your Email*" name="email" id="email"
          style="color:white ;margin-top: 3%" required />
        <label for="email" class="form__label">Your Email*</label>
      </div>

      <div class="form__group field" style="margin-top: 3%">
        <label for="email" class="form__label" style="font-size: 1.3rem">Subject*</label>
        <select class="contact-drop-down" name="option" id="option"
          style="background-color: transparent; color:white ; border: 1px solid #9b9b9b;">
          <option>Choose subject</option>
          <option value="Building">Building</option>
          <option value="Ceiling">Ceiling</option>
          <option value="Renovating">Renovating</option>
          <option value="PLasterig">Plasterig</option>
          <option value="Tiling">Tiling</option>
          <option value="Tiling">Paving</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form__group field" style="margin-top: 3%">
        <textarea class="form__field" placeholder="Your Message*" name="message" id="message" style="color:white ;"
          required></textarea>
        <label for="message" class="form__label">Message*</label>
      </div>
      <button class="button--submit contact_submit_btn" value="submit" type="submit">
        Submit
      </button>
    </form>
  </div>
