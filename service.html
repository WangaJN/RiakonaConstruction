      <hr />
      <div class="footer-contact">
        <div class="contact_Details row">
          <div class="row phone">
            <div
              class="col-2 col-lg-3"
              style="
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"

                align-items: center;
                justify-content: center;

                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"

            <div class="col-10 col-lg-9">
              <a href="mailto:Riakona1@gmail.com">
                <p style="color: blue">Riakona1@gmail.com</p>
              </a>

        <div class="vl"></div>
        <hr style="width: 80%" />
        <div class="address">

            <div
              class="col-2"
              style="
                display: flex;
                align-items: center;
                justify-content: center;

                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"

            <div class="col-10">

            </div>
          </div>

      <hr />

      <h1>STAY CONNECTED WITH US</h1>
      <div class="input-group">
        <form id="emailSubscribe" name="submit-to-google-sheet" method="post">
          <input
            type="email"
            class="input"
            id="Email"
            name="Email"
            placeholder="enter your email"
            autocomplete="off"
            style="color: black"
          />
          <button class="button--submit" value="Subscribe" type="submit">
            Submit
          </button>
          <span id="msg"></span>
        </form>
      </div>
